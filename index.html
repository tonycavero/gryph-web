<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gryph/ — Video Downloader</title>
  <style>
    /* Reset & Design System */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #070B14;
      --bg-card: #0F172A;
      --bg-surface: #1E293B;
      --cyan-bright: #00F0FF;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --cyan-dim: #0284C7;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --success-green: #10B981;
      --success-glow: rgba(16, 185, 129, 0.4);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(2, 132, 199, 0.05) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Ambient glow elements */
    .glow-sphere {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 450px;
      height: 250px;
      background: radial-gradient(ellipse, rgba(0, 240, 255, 0.15), transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    /* Container */
    .hero-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand Header */
    .brand-title {
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #FFFFFF;
      text-transform: none;
      display: inline-block;
      position: relative;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
    }

    .brand-title span.slash {
      color: var(--cyan-bright);
      text-shadow: 0 0 20px var(--cyan-glow);
    }

    /* Underline / Dash below brand */
    .brand-dash {
      width: 72px;
      height: 5px;
      background: linear-gradient(90deg, var(--cyan-bright), var(--cyan-dim));
      border-radius: 9999px;
      margin: 0.75rem auto 1.5rem auto;
      box-shadow: 0 0 16px var(--cyan-glow);
      animation: pulseDash 3s ease-in-out infinite alternate;
    }

    @keyframes pulseDash {
      0% { width: 60px; opacity: 0.8; }
      100% { width: 90px; opacity: 1; box-shadow: 0 0 24px var(--cyan-bright); }
    }

    /* Subtitle */
    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-bottom: 2.5rem;
    }

    /* Mascot Hunt Arena */
    .hunt-stage {
      width: 100%;
      height: 64px;
      position: relative;
      margin-bottom: 0.75rem;
      border-bottom: 2px dashed rgba(0, 240, 255, 0.25);
      overflow: visible;
    }

    .track-line {
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-bright), transparent);
      opacity: 0.6;
    }

    /* Dinosaur Mascot */
    .mascot {
      position: absolute;
      left: 10px;
      bottom: 2px;
      font-size: 2.5rem;
      line-height: 1;
      transform-origin: bottom center;
      transition: left 0.1s linear;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      user-select: none;
    }

    /* Idle Mascot Animation */
    .mascot.idle {
      animation: idleBob 2s ease-in-out infinite;
    }

    @keyframes idleBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }

    /* Running Hunt Mascot Animation */
    .mascot.hunting {
      animation: runHop 0.25s infinite alternate ease-in-out;
    }

    @keyframes runHop {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-8px) rotate(6deg); }
    }

    /* Victory Mascot Animation */
    .mascot.victory {
      animation: victoryJump 0.5s ease-in-out infinite alternate;
    }

    @keyframes victoryJump {
      0% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(-12px) scale(1.2) rotate(8deg); }
    }

    /* Prey Target */
    .prey {
      position: absolute;
      right: 15px;
      bottom: 6px;
      font-size: 2rem;
      line-height: 1;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .prey.idle {
      animation: preyFloat 2s ease-in-out infinite alternate;
    }

    @keyframes preyFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.08); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
    }

    .prey.eaten {
      transform: scale(1.3) rotate(15deg);
      animation: popBone 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popBone {
      0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
      70% { transform: scale(1.4) rotate(10deg); opacity: 1; }
      100% { transform: scale(1.2) rotate(0deg); }
    }

    /* Input Card Container */
    .search-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 9999px;
      padding: 0.5rem 0.6rem 0.5rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7), 0 0 20px -5px rgba(0, 240, 255, 0.15);
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--cyan-bright);
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.35);
    }

    .search-icon {
      color: var(--cyan-bright);
      display: flex;
      align-items: center;
      opacity: 0.8;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      color: #FFFFFF;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #64748B;
    }

    /* Action Button (Fetch / Hunting / Ready) */
    .btn-action {
      background: linear-gradient(135deg, var(--cyan-bright), var(--cyan-dim));
      color: #070B14;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border: none;
      outline: none;
      padding: 0.85rem 1.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      white-space: nowrap;
      user-select: none;
    }

    .btn-action:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    /* Hunting State */
    .btn-action.hunting {
      background: #1E293B;
      color: var(--cyan-bright);
      border: 1px solid var(--cyan-bright);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      cursor: not-allowed;
      animation: pulseHunting 1.2s infinite;
    }

    @keyframes pulseHunting {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; box-shadow: 0 0 25px var(--cyan-bright); }
    }

    /* Success / Ready State */
    .btn-action.ready {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      box-shadow: 0 0 20px var(--success-glow);
      cursor: pointer;
      animation: glowReady 2s infinite alternate;
    }

    @keyframes glowReady {
      0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
      100% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.8); }
    }

    /* Floating Toast Alert */
    .toast {
      position: fixed;
      top: 2rem;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FECACA;
      padding: 0.85rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(239, 68, 68, 0.2);
      transform: translateY(-50px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Quick Platform Pills */
    .platforms-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
    }

    .platform-pill {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
    }

    .platform-pill:hover {
      color: var(--cyan-bright);
      border-color: rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.05);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .search-box {
        padding: 0.4rem 0.5rem 0.4rem 1rem;
      }
      .btn-action {
        padding: 0.75rem 1.25rem;
        font-size: 0.85rem;
      }
      .search-input {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Glow -->
  <div class="glow-sphere"></div>

  <!-- Floating Toast Alert -->
  <div id="toast" class="toast">
    <span>⚠️</span>
    <span id="toastMsg">Please paste a valid video URL first!</span>
  </div>

  <main class="hero-container">
    <!-- Brand Title -->
    <h1 class="brand-title">Gryph<span class="slash">/</span></h1>
    <div class="brand-dash"></div>

    <!-- Subtitle -->
    <p class="hero-subtitle">Paste your link and download instantly</p>

    <!-- Hunt Stage (Mascot Arena) -->
    <div id="huntStage" class="hunt-stage">
      <div id="mascot" class="mascot idle">🦖</div>
      <div id="prey" class="prey idle">🎬</div>
      <div class="track-line"></div>
    </div>

    <!-- Input Search Box -->
    <div class="search-box">
      <div class="search-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>

      <input
        type="text"
        id="videoUrl"
        class="search-input"
        placeholder="Paste Facebook, Pinterest, TikTok, YouTube link..."
        autocomplete="off"
        spellcheck="false"
      />

      <button id="btnAction" class="btn-action">
        <span>Fetch</span>
      </button>
    </div>

    <!-- Quick Supported Platforms -->
    <div class="platforms-row">
      <span class="platform-pill" onclick="pasteSample('https://pin.it/2qs4gIH2I')">Pinterest</span>
      <span class="platform-pill" onclick="pasteSample('https://www.facebook.com')">Facebook</span>
      <span class="platform-pill" onclick="pasteSample('https://www.tiktok.com')">TikTok</span>
      <span class="platform-pill" onclick="pasteSample('https://www.instagram.com')">Instagram</span>
      <span class="platform-pill" onclick="pasteSample('https://www.youtube.com')">YouTube 4K</span>
    </div>
  </main>

  <script>
    // Elements
    const input = document.getElementById('videoUrl');
    const btnAction = document.getElementById('btnAction');
    const mascot = document.getElementById('mascot');
    const prey = document.getElementById('prey');
    const stage = document.getElementById('huntStage');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let currentPhase = 'idle'; // 'idle' | 'hunting' | 'ready'
    let huntAnimationInterval = null;

    // Toast helper
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Helper to paste sample links
    function pasteSample(url) {
      input.value = url;
      input.focus();
      resetToIdle();
    }

    // Reset Mascot to Start
    function resetToIdle() {
      currentPhase = 'idle';
      clearInterval(huntAnimationInterval);
      mascot.style.left = '10px';
      mascot.className = 'mascot idle';
      mascot.innerText = '🦖';
      prey.className = 'prey idle';
      prey.innerText = '🎬';
      btnAction.disabled = false;
      btnAction.className = 'btn-action';
      btnAction.innerHTML = '<span>Fetch</span>';
    }

    // Main Action Button Handler
    btnAction.addEventListener('click', () => {
      // Phase 3 Click: Download Ready
      if (currentPhase === 'ready') {
        alert('¡Video capturado con éxito!');
        // Trigger download if url is present
        const val = input.value.trim();
        if (val) {
          const apiBase = 'https://gryph-web.onrender.com';
          window.location.href = `${apiBase}/api/download?url=${encodeURIComponent(val)}&format=720p&title=video_gryph`;
        }
        resetToIdle();
        return;
      }

      // Phase 1: Validation
      const urlValue = input.value.trim();
      if (!urlValue) {
        showToast('Please paste a video link first!');
        input.focus();
        return;
      }

      // Phase 2: Processing (Descarga)
      currentPhase = 'hunting';
      btnAction.disabled = true;
      btnAction.className = 'btn-action hunting';
      btnAction.innerHTML = '<span>Hunting...</span>';

      mascot.className = 'mascot hunting';

      // Animate mascot running from left to right over 3 seconds
      const startX = 10;
      const stageWidth = stage.clientWidth;
      const targetX = stageWidth - 65; // Stop right at the prey
      const durationMs = 3000;
      const startTime = performance.now();

      function stepRun(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / durationMs, 1);

        // Smooth easeInQuad acceleration as dino charges
        const easeVal = progress * progress;
        const currentX = startX + (targetX - startX) * progress;

        mascot.style.left = currentX + 'px';

        if (progress < 1) {
          requestAnimationFrame(stepRun);
        } else {
          // Phase 3: Success
          finishHunt();
        }
      }

      requestAnimationFrame(stepRun);
    });

    // Phase 3: Success Handler
    function finishHunt() {
      currentPhase = 'ready';

      // Mascot chomps prey!
      prey.className = 'prey eaten';
      prey.innerText = '🍖'; // Changes to meat/bone

      mascot.className = 'mascot victory';
      mascot.innerText = '🦖';

      // Button transforms to vibrant green
      btnAction.disabled = false;
      btnAction.className = 'btn-action ready';
      btnAction.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download Ready!</span>
      `;
    }

    // Enter key trigger
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        btnAction.click();
      }
    });

    // Reset when user starts typing a new URL
    input.addEventListener('input', () => {
      if (currentPhase === 'ready') {
        resetToIdle();
      }
    });
  </script>
</body>
</html>
